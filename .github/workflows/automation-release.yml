name: Automation release

on:
  push:
    branches: [main, new/automation]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: automation-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, evidence and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mcp-server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix apps/mcp-server
      - run: npm run prisma:generate
      - run: npm run check:release
      - run: npm audit --audit-level=high
      - run: npm audit --prefix apps/mcp-server --audit-level=high
