- id: fan_timer
  alias: Bathroom fan timer
  mode: restart
  triggers:
    - trigger: state
      entity_id: binary_sensor.bathroom_occupied
      from: "off"
      to: "on"
  actions:
    - action: switch.turn_on
      target: {entity_id: switch.bathroom_fan}
    - delay: {minutes: 2}
    - action: switch.turn_off
      target: {entity_id: switch.bathroom_fan}
- id: fan_boost
  alias: Manual fan boost
  mode: single
  triggers:
    - trigger: state
      entity_id: input_boolean.fan_boost
      to: "on"
  actions:
    - action: switch.turn_on
      target: {entity_id: switch.bathroom_fan}
